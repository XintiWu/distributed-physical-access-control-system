apiVersion: v1
kind: Secret
metadata:
  name: grafana-clickhouse-secret
  namespace: monitoring
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://frontend.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: ClickHouse-Analytics
        type: grafana-clickhouse-datasource
        uid: clickhouse
        access: proxy
        jsonData:
          host: ${CLICKHOUSE_HOST}
          port: 8443
          protocol: http
          secure: true
          defaultDatabase: access_control
          username: default
          tlsSkipVerify: true
        secureJsonData:
          password: ${CLICKHOUSE_PASSWORD}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Access Control'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana-dashboards
---
